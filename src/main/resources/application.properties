spring.application.name=zhanserikkyzy-akbota-student-api
server.port=8080

# Database settings come from environment variables (no secrets in Git)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studentdb}
spring.datasource.username=${DB_USER:student}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
